[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdelegram"
version = "0.1.0"
description = "A full-featured Telegram client library + CLI backed by TDLib"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "TDelegram" }]
keywords = ["telegram", "tdlib", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "typer>=0.9",
  "rich>=13",
]

[project.urls]
Homepage = "https://github.com/bulanovdm/TDelegram"
Repository = "https://github.com/bulanovdm/TDelegram"
Issues = "https://github.com/bulanovdm/TDelegram/issues"
Changelog = "https://github.com/bulanovdm/TDelegram/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
tdelegram = "tdelegram.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tdelegram"]

[tool.hatch.build.targets.wheel.force-include]
"src/tdelegram/py.typed" = "tdelegram/py.typed"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true
[[tool.mypy.overrides]]
module = "tdelegram.tdjson"
ignore_errors = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tdelegram --cov-report=term-missing --cov-fail-under=84"

[tool.coverage.run]
source = ["tdelegram"]
# Only the ctypes binding is exempt: it is a direct FFI surface that
# cannot execute without a real libtdjson. Everything else is measured.
omit = ["*/tdjson.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise AssertionError"]
