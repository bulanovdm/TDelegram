name: release

# A version tag is a release:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Nothing is published until the suite passes on every supported interpreter
# and the tag, pyproject.toml and CHANGELOG.md agree on the version. Then, one
# after another, so that a failure stops everything after it: the wheel is
# built and tried, and the Docker image is built, tried and tagged. Once the
# image is out, PyPI gets the sdist and the wheel and a GitHub release carries
# both files with the version's CHANGELOG.md section as its notes. Those two
# do not wait on each other: a PyPI publisher that is not set up, or an
# approval that is still pending, must not keep the release off the Releases
# page, and a failed release must not stop PyPI. PyPI never accepts a version
# twice, so it still comes after everything that can fail before it.
# RELEASING.md says what to do when a step does.
#
# PyPI authentication is Trusted Publishing (OIDC). There is no API token
# anywhere: no repository secret to leak, rotate, or scope wrongly. The
# one-time setup is on PyPI, not here -- see RELEASING.md.

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  # Never publish something the suite has not passed on every supported
  # interpreter. A tag is not a reason to skip the gate.
  verify:
    uses: ./.github/workflows/ci.yml

  # The tag must be "v" plus pyproject.toml's version, and CHANGELOG.md must
  # have a dated section for it. Also decides, from every other release, which
  # floating image tags this one takes and whether GitHub calls it "Latest".
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      latest: ${{ steps.release.outputs.latest }}
      docker_tags: ${{ steps.release.outputs.docker_tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, to tell whether a newer release exists
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install packaging

      - id: release
        run: |
          python scripts/release.py "$GITHUB_REF_NAME" \
            --tags "$(git tag --list 'v*')" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}" \
            --notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  build:
    needs: [verify, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Install the wheel somewhere clean and run it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/relcheck"
          "$RUNNER_TEMP/relcheck/bin/pip" install "dist/tdelegram-$VERSION-py3-none-any.whl"
          reported="$("$RUNNER_TEMP/relcheck/bin/tdelegram" version)"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::the wheel reports $reported, not $VERSION" >&2
            exit 1
          fi
          # methods.json must ship in the wheel: the write gate fails closed
          # without it, so a wheel missing it refuses every call.
          "$RUNNER_TEMP/relcheck/bin/python" -c \
            "from tdelegram import safety; assert safety.verdict('sendMessage') == 'write'; print('gate ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Builds and tries the image on both architectures, then tags it. After the
  # wheel, so a failure anywhere before this point leaves nothing published.
  docker:
    needs: [verify, check, build]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.check.outputs.version }}
      tags: ${{ needs.check.outputs.docker_tags }}

  pypi:
    needs: [build, docker]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token that stands in for an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A tag alone is listed under Tags, not Releases. This is the release: both
  # files, the changelog section as its notes, "Latest" and pre-release set to
  # match the image tags. It waits for the image, not for PyPI, so it exists
  # whenever the version has shipped from this repository.
  #
  # Built as a draft and published last, so a failure while the files upload
  # leaves nothing on the Releases page that is missing them.
  github-release:
    needs: [check, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: notes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then
              # A re-run after the release was published: only make sure the files are on it.
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
              exit 0
            fi
            # A draft an earlier attempt left behind; start it over.
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --verify-tag \
            --title "TDelegram $VERSION" \
            --notes-file notes.md \
            --prerelease="$PRERELEASE"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$LATEST"
          echo "Published $(gh release view "$GITHUB_REF_NAME" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
