name: ci

on:
  push:
  pull_request:
  workflow_call: # reused as the release gate

env:
  # TDLib generates td_api.h at build time, so CI reads the scheme file it is
  # generated from instead of building TDLib (~20 min). Both parse to the same
  # function set. Bump this together with methods.json and the expected count
  # in tests/contract/test_registry.py.
  TDLIB_COMMIT: d1085f9cebc5a62379991ae1652673954f229c1f

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what pyproject claims to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"

      - name: Fetch pinned TDLib scheme
        run: |
          curl -fsSL -o "$RUNNER_TEMP/td_api.tl" \
            "https://raw.githubusercontent.com/tdlib/td/$TDLIB_COMMIT/td/generate/scheme/td_api.tl"
          echo "TDELEGRAM_TD_API=$RUNNER_TEMP/td_api.tl" >> "$GITHUB_ENV"

      - name: Registry is in sync with the schema
        run: |
          python scripts/generate_method_registry.py --output src/tdelegram/methods.json
          git diff --exit-code -- src/tdelegram/methods.json

      - run: pytest -q
      - run: ruff check src tests scripts
      - run: mypy --strict src/
