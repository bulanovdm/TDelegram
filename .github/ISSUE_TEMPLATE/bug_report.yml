name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything:** TDelegram talks to a real Telegram
        account. Never include your `api_hash`, your session directory
        (`~/.tdelegram/`), a database key, or an unredacted log. Replace chat
        titles, phone numbers and message text if they are not yours to share.

        Found a security problem? Do not open an issue — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Command or code
      description: The smallest command or snippet that shows the problem.
      render: shell
      placeholder: tdelegram chat history --chat somechat --limit 5
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        Data goes to stdout, diagnostics to stderr, so capture both.
        Re-run with `--verbose` if it is not obvious. Redact before pasting.
      render: shell
    validations:
      required: false

  - type: input
    id: tdelegram-version
    attributes:
      label: TDelegram version
      placeholder: "0.1.0, or a commit sha"
    validations:
      required: true

  - type: input
    id: tdlib-version
    attributes:
      label: TDLib version
      description: >
        Many issues are really TDLib version differences. Your authorized
        session reports it, or check your install.
      placeholder: "1.8.67"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is libtdjson installed?
      options:
        - Homebrew (macOS)
        - Built from source
        - Docker image from this repo
        - Distribution package
        - Other / not sure
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "macOS 15.6 / Python 3.12.4"
    validations:
      required: true

  - type: checkboxes
    id: gate
    attributes:
      label: Does this involve the write gate?
      description: >
        A method classified read/write/destructive in `methods.json`. A wrong
        verdict is a safety bug and gets priority.
      options:
        - label: A mutating call went through without `--yes`
        - label: A read-only call was refused as a write
        - label: The verdict for a method looks wrong
        - label: Not related to the gate
